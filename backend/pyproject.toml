[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coder-sandbox"
version = "0.1.0"
description = "Autonomous Coding Agent — Terminal CLI & Web Studio Device Bridge"
requires-python = ">=3.11"
dependencies = [
    "groq",
    "python-dotenv",
    "pydantic[email]",
    "pydantic-settings",
    "rich",
    "prompt_toolkit",
    "fastapi",
    "uvicorn",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-asyncio",
    "aiosqlite",
    "httpx",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "websockets>=12.0",
]

[project.scripts]
ai-coder = "app.cli:main"
agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["workspace*"]