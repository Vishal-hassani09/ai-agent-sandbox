[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-sandbox"
version = "0.1.0"
dependencies = [
    "groq",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "rich",
    "prompt_toolkit",
    "fastapi",
    "uvicorn"
]

[project.scripts]
agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["workspace*"]