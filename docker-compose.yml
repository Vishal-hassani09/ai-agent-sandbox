services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WORKSPACE_DIR=/app/workspace
    volumes:
      # Mount workspace locally so generated code persists and can be inspected
      - ./backend/workspace:/app/workspace
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - agent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: ai-agent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge