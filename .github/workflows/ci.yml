name: CI Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Backend Quality Gate: Linting, Security Contracts & Integration Tests
  # =========================================================================
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pylint pytest pytest-cov

      - name: Run Pylint Check
        run: |
          pylint --rcfile=../.pylintrc app tests

      - name: Run Pytest Integration & Contract Tests
        env:
          GROQ_API_KEY: "gsk_dummy_mock_key_for_testing"
          WORKSPACE_DIR: "./workspace"
          PYTHONPATH: .
        run: |
          pytest -v tests/ --cov=app --cov-report=term-missing

  # =========================================================================
  # Frontend Quality Gate: Linting & Vitest Component Tests
  # =========================================================================
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0

      - name: Install Dependencies
        run: |
          npm install

      - name: Run ESLint
        run: |
          npm run lint

      - name: Run Vitest Suite
        run: |
          npx vitest run --no-isolate

      - name: Verify Build
        run: |
          npm run build