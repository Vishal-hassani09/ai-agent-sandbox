name: CI Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- 1. Backend Quality Gate ---
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pylint pytest pytest-cov pytest-asyncio aiosqlite

      - name: Run Pylint Static Analysis
        run: pylint --rcfile=../.pylintrc app tests

      - name: Run Pytest Suite
        env:
          GROQ_API_KEY: "gsk_dummy_ci_key_for_unit_tests_only"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci_dummy_secret_key"
        run: pytest -v tests/ --cov=app --cov-report=term-missing

  # --- 2. Frontend Quality Gate ---
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test -- --run

      - name: Verify Production Build
        run: npm run build

  # --- 3. Docker Stack Verification ---
  docker-build:
    name: Docker Stack Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Compose Stack
        run: docker compose build